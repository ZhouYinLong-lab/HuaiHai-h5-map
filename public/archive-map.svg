<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">淮海战役地标与战场态势原创示意图</title>
  <desc id="desc">依据公开党史和文旅资料重新绘制的交互示意底图，呈现徐州、邳州、宿县、双堆集、永城、商丘等区域关系，不作为精确导航地图。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ead9ae"/>
      <stop offset=".48" stop-color="#e2c991"/>
      <stop offset="1" stop-color="#d5b779"/>
    </linearGradient>
    <radialGradient id="vignette">
      <stop offset=".58" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#5b3b1d" stop-opacity=".24"/>
    </radialGradient>
    <pattern id="smallGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6c5436" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <pattern id="largeGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#5d4328" stroke-opacity=".09" stroke-width="2"/>
    </pattern>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="4" seed="18"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .13"/></feComponentTransfer>
    </filter>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence baseFrequency=".012" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/>
    </filter>
    <filter id="inkShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#3a2515" flood-opacity=".24"/>
    </filter>
    <marker id="redArrow" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 3h7V0h4v4h3v3h2v2h-2v3h-3v4H7v-3H0v-4h4V7H0Z" fill="#9f2729"/>
    </marker>
    <marker id="darkArrow" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 3h7V0h4v4h3v3h2v2h-2v3h-3v4H7v-3H0v-4h4V7H0Z" fill="#493528"/>
    </marker>
  </defs>

  <rect display="none" width="1800" height="1120" fill="url(#paper)"/>
  <rect display="none" width="1800" height="1120" fill="url(#smallGrid)"/>
  <rect display="none" width="1800" height="1120" fill="url(#largeGrid)"/>
  <image href="./media/pixel/map-base-v2.png" x="0" y="0" width="1800" height="1120" preserveAspectRatio="none"/>

  <!-- 三阶段态势区域：像素折角边界 -->
  <g display="none" shape-rendering="crispEdges" stroke-linejoin="miter">
    <path d="M980 92h140V75h160v17h150v26h130v42h90v68h70v120h-25v90h-95v60h-145v40h-175v15h-155v-25H995v-30h-85v-50h-40v-60h25v-75h35V210h30v-70h20Z" fill="#9c3030" fill-opacity=".055" stroke="#9c3030" stroke-opacity=".25" stroke-dasharray="16 12" stroke-width="3"/>
    <path d="M490 480h130v-30h160v20h150v30h100v60h60v115h30v80h-25v95h-65v75H930v65H780v35H620v-15H520v-30h-90v-50h-80v-70h-35v-90h15v-90h30v-85h50v-55h80Z" fill="#9c3030" fill-opacity=".06" stroke="#9c3030" stroke-opacity=".25" stroke-dasharray="16 12" stroke-width="3"/>
    <path d="M40 405h140v-45h140v-15h150v20h120v45h80v85h50v70h-20v95h-50v80h-90v60H440v35H300v5H210v-25h-80v-35H60v-50H10v-90h-30V540H0v-80h40Z" fill="#4e392b" fill-opacity=".045" stroke="#4e392b" stroke-opacity=".22" stroke-dasharray="16 12" stroke-width="3"/>
  </g>

  <!-- 等高线与山地纹理：阶梯折线 -->
  <g display="none" fill="none" stroke="#795c38" stroke-opacity=".14" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" shape-rendering="crispEdges">
    <path d="M-60 120h120v-15h120v7h125v23h125v25h140v15h120v-25h120v-30h120v-8h120v18h120v25h120v-15h120v-20h130v10h80v30h80"/>
    <path d="M-70 180h140v-15h135v12h125v28h120v18h135v-20h125v-35h135v-20h140v25h130v28h150v-18h120v-25h140v18h120v20h80"/>
    <path d="M-50 930h145v-20h130v12h125v-25h145v-20h135v-38h145v-27h135v18h130v38h130v28h155v-15h140v-35h140v-20h140"/>
    <path d="M-50 990h145v-18h135v15h135v-30h145v-22h140v-30h150v-20h140v22h125v36h145v30h155v-20h140v-30h140v-18h140"/>
    <path d="M110 360h80v-28h120v-20h125v18h105v35h110v20h125v-25h110v-32h120v-18h110"/>
    <path d="M1160 660h125v-35h125v-18h105v22h120v38h125v20h120v-20h100"/>
  </g>
  <g display="none" fill="#6f5738" fill-opacity=".12" shape-rendering="crispEdges">
    <path d="M120 315h18v-12h12v-20h12v-28h12v28h12v20h12v12h22v12h-100Z"/>
    <path d="M1440 570h18v-15h12v-25h12v-35h12v35h12v25h12v15h24v12h-102Z"/>
    <path d="M470 910h20v-18h12v-25h12v-38h14v38h12v25h12v18h24v12H470Z"/>
  </g>

  <!-- 河流：方形端点与阶梯河道 -->
  <g display="none" fill="none" stroke-linecap="square" stroke-linejoin="miter" shape-rendering="crispEdges">
    <path d="M-50 235h120v-15h85v10h95v40h100v25h110v-25h115v-40h115v-32h125v-23h115v5h115v24h110v34h115v17h115v-5h110v-18h115v-10h115v18h125" stroke="#617c78" stroke-opacity=".6" stroke-width="20"/>
    <path d="M-50 235h120v-15h85v10h95v40h100v25h110v-25h115v-40h115v-32h125v-23h115v5h115v24h110v34h115v17h115v-5h110v-18h115v-10h115v18h125" stroke="#9aa99b" stroke-opacity=".35" stroke-width="3" stroke-dasharray="4 12"/>
    <path d="M-40 850h120v-25h100v-20h110v20h120v-10h110v-40h130v-45h110v-10h100v22h110v38h105v45h105v25h120v-5h115v-35h115v-25h110v15h110v-20h120" stroke="#63817d" stroke-opacity=".54" stroke-width="15"/>
    <path d="M-40 850h120v-25h100v-20h110v20h120v-10h110v-40h130v-45h110v-10h100v22h110v38h105v45h105v25h120v-5h115v-35h115v-25h110v15h110v-20h120" stroke="#9aa99b" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 10"/>
    <path d="M1420 70v90h-20v90h15v90h35v85h30v95h20v90h-10v90h20v90h-15v90h-35v90h-20v90" stroke="#718c85" stroke-opacity=".43" stroke-width="11"/>
  </g>
  <g fill="#1e2926" fill-opacity=".92" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="900" paint-order="stroke fill" stroke="#ead6a6" stroke-opacity=".82" stroke-width="3">
    <text x="105" y="210" rotate="-5">故黄河</text>
    <text x="1110" y="785" rotate="-8">浍河水系</text>
    <text x="1475" y="300" rotate="72">运河</text>
  </g>

  <!-- 铁路交通：像素折线 -->
  <g display="none" fill="none" stroke="#42352b" stroke-opacity=".52" stroke-linecap="square" stroke-linejoin="miter" shape-rendering="crispEdges">
    <path d="M80 470h120v-10h120v-10h120v-15h120v-20h120v-25h130v-25h120v-5h125v-10h125v-8h130v-5h120v-5h130" stroke-width="6"/>
    <path d="M82 470h120v-10h120v-10h120v-15h120v-20h120v-25h130v-25h120v-5h125v-10h125v-8h130v-5h120v-5h130" stroke="#d8bd82" stroke-width="2" stroke-dasharray="12 11"/>
    <path d="M920 40v120h-5v130h10v150h-20v180h10v150h20v150h18v120" stroke-width="6"/>
    <path d="M920 40v120h-5v130h10v150h-20v180h10v150h20v150h18v120" stroke="#d8bd82" stroke-width="2" stroke-dasharray="12 11"/>
  </g>
  <g fill="#1c1915" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="900" opacity=".92" paint-order="stroke fill" stroke="#ead6a6" stroke-opacity=".82" stroke-width="3">
    <text x="430" y="420" rotate="-4">陇海铁路</text>
    <text x="940" y="470" writing-mode="vertical-rl" glyph-orientation-vertical="0" text-anchor="middle">
      <tspan x="940" dy="0">津</tspan>
      <tspan x="940" dy="25">浦</tspan>
      <tspan x="940" dy="25">铁</tspan>
      <tspan x="940" dy="25">路</tspan>
    </text>
  </g>

  <!-- 作战动线：像素折线与方块箭头 -->
  <g display="none" fill="none" stroke-linecap="square" stroke-linejoin="miter" shape-rendering="crispEdges">
    <path d="M1590 280h-100v14h-100v16h-100v16h-105v14h-105v-5H975" stroke="#9f2729" stroke-width="13" stroke-dasharray="26 17" marker-end="url(#redArrow)"/>
    <path d="M1530 185h-140v15h-120v25h-105v30h-105" stroke="#9f2729" stroke-width="9" stroke-dasharray="20 14" marker-end="url(#redArrow)"/>
    <path d="M640 950v-70h15v-60h20v-55h25v-60h30v-60h30v-70h25v-55" stroke="#9f2729" stroke-width="13" stroke-dasharray="26 17" marker-end="url(#redArrow)"/>
    <path d="M360 710h90v-30h90v-30h90v-20h70" stroke="#9f2729" stroke-width="10" stroke-dasharray="22 15" marker-end="url(#redArrow)"/>
    <path d="M190 675h60v-25h55v-30h55v-20h60" stroke="#493528" stroke-width="8" stroke-dasharray="18 14" marker-end="url(#darkArrow)"/>
    <path d="M915 400h-40v40h-40v40h-45v40h-45v35h-80v25" stroke="#493528" stroke-width="8" stroke-dasharray="18 14" marker-end="url(#darkArrow)"/>
  </g>

  <!-- 城镇与区域 -->
  <g font-family="SimHei, Microsoft YaHei, Arial, sans-serif" fill="#171411" font-weight="900" paint-order="stroke fill" stroke="#ead6a6" stroke-opacity=".86" stroke-width="5">
    <g font-size="58" opacity=".96" writing-mode="vertical-rl" glyph-orientation-vertical="0" text-anchor="middle">
      <text x="890" y="330">徐州</text>
      <text x="1320" y="320">邳州</text>
      <text x="710" y="670">宿县</text>
      <text x="285" y="630">永城</text>
      <text x="75" y="700">商丘</text>
    </g>
    <g font-size="34" opacity=".9" writing-mode="vertical-rl" glyph-orientation-vertical="0" text-anchor="middle">
      <text x="1010" y="190">贾汪</text>
      <text x="1500" y="410">新沂 · 窑湾</text>
      <text x="620" y="540">萧县</text>
      <text x="600" y="790">临涣</text>
      <text x="760" y="990">双堆集</text>
      <text x="310" y="560">陈官庄</text>
    </g>
  </g>

  <!-- 阶段印章 -->
  <g display="none" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-weight="900" paint-order="stroke fill" stroke="#ead6a6" stroke-opacity=".8" stroke-width="2">
    <g transform="translate(1380 90) rotate(3)">
      <rect width="250" height="80" fill="#efe0b8" fill-opacity=".76" stroke="#9f2729" stroke-width="3"/>
      <text x="125" y="34" fill="#1d1814" font-size="25" text-anchor="middle">第一阶段</text>
      <text x="125" y="62" fill="#1d1814" font-size="17" text-anchor="middle">徐东 · 碾庄圩方向</text>
    </g>
    <g transform="translate(650 845) rotate(-2)">
      <rect width="270" height="80" fill="#efe0b8" fill-opacity=".76" stroke="#9f2729" stroke-width="3"/>
      <text x="135" y="34" fill="#1d1814" font-size="25" text-anchor="middle">第二阶段</text>
      <text x="135" y="62" fill="#1d1814" font-size="17" text-anchor="middle">宿县 · 双堆集方向</text>
    </g>
    <g transform="translate(95 410) rotate(-3)">
      <rect width="270" height="80" fill="#efe0b8" fill-opacity=".76" stroke="#493528" stroke-width="3"/>
      <text x="135" y="34" fill="#1d1814" font-size="25" text-anchor="middle">第三阶段</text>
      <text x="135" y="62" fill="#1d1814" font-size="17" text-anchor="middle">永城 · 陈官庄方向</text>
    </g>
  </g>

  <!-- 标题牌 -->
  <g transform="translate(410 225)" filter="url(#inkShadow)">
    <path d="M0 0h520l28 28v122H0Z" fill="#efe1ba" fill-opacity=".92" stroke="#5e432e" stroke-opacity=".72" stroke-width="3"/>
    <path d="M520 0v28h28" fill="none" stroke="#5e432e" stroke-width="3"/>
    <text x="28" y="54" fill="#1d1814" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="5">淮海战役地标与事件图</text>
    <text x="30" y="96" fill="#1d1814" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="900">1948.11.06 — 1949.01.10</text>
    <text x="30" y="128" fill="#1d1814" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2">ORIGINAL INTERACTIVE SITUATION MAP · 非导航地图</text>
  </g>

  <!-- 16-bit 像素罗盘与方位说明 -->
  <g transform="translate(1586 855)" opacity=".92" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-weight="900" shape-rendering="crispEdges" paint-order="stroke fill" stroke="#ead6a6" stroke-opacity=".7" stroke-width="2">
    <path d="M78 8h16v5h14v7h10v10h10v12h6v16h6v16h4v24h-4v16h-6v16h-6v12h-10v10H108v7H94v5H78v-5H64v-7H50v-10H40v-12H30v-16h-6V94h-4V78h4V62h6V46h6V34h10V24h10V16h14v-5h8Z" fill="#efe1ba" fill-opacity=".22" stroke="#4d3829" stroke-width="4"/>
    <path d="M78 22h16v5h14v8h10v12h8v16h6v23h-6v16h-8v12h-10v8H94v5H78v-5H64v-8H54v-12h-8V86h-4V63h6V47h8V35h10v-8h12Z" fill="none" stroke="#6a4b32" stroke-width="2" stroke-dasharray="5 7"/>
    <g fill="#4d3829">
      <rect x="82" y="10" width="8" height="18"/>
      <rect x="82" y="144" width="8" height="18"/>
      <rect x="10" y="82" width="18" height="8"/>
      <rect x="144" y="82" width="18" height="8"/>
      <rect x="43" y="43" width="8" height="8"/>
      <rect x="121" y="121" width="8" height="8"/>
      <rect x="121" y="43" width="8" height="8"/>
      <rect x="43" y="121" width="8" height="8"/>
    </g>
    <path d="M82 18h8v8h4v10h4v10h4v10h4v10h4v8h-8v6H70v-6h-8v-8h4V56h4V46h4V36h4V26h4Z" fill="#9f2729" stroke="#713b2d" stroke-width="2"/>
    <path d="M82 154h8v-8h4v-10h4v-10h4v-10h4V106h4V98h-8v-6H70v6h-8v8h4v10h4v10h4v10h4v10h4Z" fill="#493528" stroke="#493528" stroke-width="2"/>
    <path d="M18 82h8v-4h10v-4h10v-4h10v-4h10v-4h8v8h6v16h-6v8h-8v-4H56v-4H46v-4H36v-4H26v-4H18Z" fill="#b28a4d" stroke="#6a4b32" stroke-width="2"/>
    <path d="M154 82h-8v-4h-10v-4h-10v-4h-10v-4h-10v-4h-8v8h-6v16h6v8h8v-4h10v-4h10v-4h10v-4h10v-4h8Z" fill="#b28a4d" stroke="#6a4b32" stroke-width="2"/>
    <rect x="78" y="78" width="16" height="16" fill="#d8bd82" stroke="#4d3829" stroke-width="4"/>
    <rect x="84" y="84" width="4" height="4" fill="#9f2729" stroke="none"/>
    <g fill="#4d3829" font-size="25" text-anchor="middle">
      <text x="86" y="-2">北</text>
      <text x="178" y="94">东</text>
      <text x="86" y="192">南</text>
      <text x="-6" y="94">西</text>
    </g>
  </g>
  <g transform="translate(80 1020)" fill="#1d1814" opacity=".9" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-weight="800">
    <text font-size="18">地理关系与作战动线为互动展示示意，不用于精确导航或学术制图。</text>
  </g>

  <rect width="1800" height="1120" fill="url(#vignette)"/>
  <rect width="1800" height="1120" filter="url(#grain)" opacity=".8"/>
</svg>
